/*
 * CSS for jsPsych experiments.
 *
 * This stylesheet provides minimal styling to make jsPsych
 * experiments look polished without any additional styles.
 */
/* Container holding jsPsych content */
.jspsych-display-element {
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

.jspsych-display-element:focus {
  outline: none;
}

.jspsych-content-wrapper {
  display: flex;
  margin: auto;
  flex: 1 1 100%;
  width: 100%;
}

.jspsych-content {
  max-width: 95%;
  /* this is mainly an IE 10-11 fix */
  text-align: center;
  margin: auto;
  /* this is for overflowing content */
}

.jspsych-top {
  align-items: flex-start;
}

.jspsych-middle {
  align-items: center;
}

/* fonts and type */
.jspsych-display-element {
  font-family: "Open Sans", "Arial", sans-serif;
  font-size: 18px;
  line-height: 1.6em;
}

/* Form elements like input fields and buttons */
.jspsych-display-element input[type=text] {
  font-family: "Open Sans", "Arial", sans-serif;
  font-size: 14px;
}

/* borrowing Bootstrap style for btn elements, but combining styles a bit */
.jspsych-btn {
  display: inline-block;
  padding: 6px 12px;
  margin: 0px;
  font-size: 14px;
  font-weight: 400;
  font-family: "Open Sans", "Arial", sans-serif;
  cursor: pointer;
  line-height: 1.4;
  text-align: center;
  white-space: nowrap;
  vertical-align: middle;
  background-image: none;
  border: 1px solid transparent;
  border-radius: 4px;
  color: #333;
  background-color: #fff;
  border-color: #ccc;
}

/* only apply the hover style on devices with a mouse/pointer that can hover - issue #977 */
@media (hover: hover) {
  .jspsych-btn:hover {
    background-color: #ddd;
    border-color: #aaa;
  }
}
.jspsych-btn:active {
  background-color: #ddd;
  border-color: #000000;
}

.jspsych-btn:disabled {
  background-color: #eee;
  color: #aaa;
  border-color: #ccc;
  cursor: not-allowed;
}

/* custom style for input[type="range] (slider) to improve alignment between positions and labels */
.jspsych-slider {
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  width: 100%;
  background: transparent;
}

.jspsych-slider:focus {
  outline: none;
}

/* track */
.jspsych-slider::-webkit-slider-runnable-track {
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  height: 8px;
  cursor: pointer;
  background: #eee;
  box-shadow: 0px 0px 0px #000000, 0px 0px 0px #0d0d0d;
  border-radius: 2px;
  border: 1px solid #aaa;
}

.jspsych-slider::-moz-range-track {
  appearance: none;
  width: 100%;
  height: 8px;
  cursor: pointer;
  background: #eee;
  box-shadow: 0px 0px 0px #000000, 0px 0px 0px #0d0d0d;
  border-radius: 2px;
  border: 1px solid #aaa;
}

.jspsych-slider::-ms-track {
  appearance: none;
  width: 99%;
  height: 14px;
  cursor: pointer;
  background: #eee;
  box-shadow: 0px 0px 0px #000000, 0px 0px 0px #0d0d0d;
  border-radius: 2px;
  border: 1px solid #aaa;
}

/* thumb */
.jspsych-slider::-webkit-slider-thumb {
  border: 1px solid #666;
  height: 24px;
  width: 15px;
  border-radius: 5px;
  background: #ffffff;
  cursor: pointer;
  -webkit-appearance: none;
  margin-top: -9px;
}

.jspsych-slider::-moz-range-thumb {
  border: 1px solid #666;
  height: 24px;
  width: 15px;
  border-radius: 5px;
  background: #ffffff;
  cursor: pointer;
}

.jspsych-slider::-ms-thumb {
  border: 1px solid #666;
  height: 20px;
  width: 15px;
  border-radius: 5px;
  background: #ffffff;
  cursor: pointer;
  margin-top: -2px;
}

/* jsPsych progress bar */
#jspsych-progressbar-container {
  color: #555;
  border-bottom: 1px solid #dedede;
  background-color: #f9f9f9;
  margin-bottom: 1em;
  text-align: center;
  padding: 8px 0px;
  width: 100%;
  line-height: 1em;
}

#jspsych-progressbar-container span {
  font-size: 14px;
  padding-right: 14px;
}

#jspsych-progressbar-outer {
  background-color: #eee;
  width: 50%;
  margin: auto;
  height: 14px;
  display: inline-block;
  vertical-align: middle;
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.1);
}

#jspsych-progressbar-inner {
  background-color: #aaa;
  width: 0%;
  height: 100%;
}

/* Control appearance of jsPsych.data.displayData() */
#jspsych-data-display {
  text-align: left;
}


html, body {
  height: 100%;
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
}

body {
  background-color: #F7F7F7;
  color: black;
}

.jspsych-content-wrapper {
  align-items: center;
}

/* progress bar pinned top-center */
relative {
  position: fixed;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
}

relative progress {
  width: 70vw;
  max-width: 400px;
  height: 10px;
}

/* word pair: centered column filling the middle of a portrait screen */
#jspsych-html-keyboard-response-stimulus {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 3vh;
  width: 100%;
  font-size: 24pt !important;
}

.center1, .center2 {
  position: static;
  transform: none;
  width: 86vw;
  max-width: 420px;
  text-align: center;
}

.maze-option {
  cursor: pointer;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  border: 2px solid #ccc;
  border-radius: 16px;
  background-color: #ffffff;
  min-height: 14vh;
  padding: 14px 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-wrap: anywhere;
}

.maze-option p {
  margin: 0;
  width: 100%;
}

.maze-option:active {
  background-color: #d8e6f5;
  border-color: #4a90d9;
}

@media (hover: hover) {
  .maze-option:hover {
    border-color: #4a90d9;
  }
}

/* comprehension question above the word pair */
.prompt1 {
  position: static;
  transform: none;
  width: 90vw;
  max-width: 700px;
  margin: 0 auto 4vh auto;
  text-align: center;
  font-size: 16pt;
  font-weight: bold;
  line-height: 1.35;
}

/* instructions pages */
.jspsych-content {
  font-size: 14pt;
  line-height: 1.5;
}

.jspsych-btn {
  font-size: 14pt;
  padding: 12px 28px;
  border-radius: 12px;
  touch-action: manipulation;
}

/* wide screens (PC, tablet landscape): word pair side by side, bigger font */
@media (min-width: 900px) {
  #jspsych-html-keyboard-response-stimulus {
    flex-direction: row;
    gap: 40px;
    font-size: 28pt !important;
  }
  .center1, .center2 {
    width: 340px;
  }
  .maze-option {
    min-height: 110px;
  }
}

/* ---- SES leveling test + intake form (phone-first) ---- */

#ses-header {
  width: 92vw;
  max-width: 700px;
  margin: 5vh auto 0 auto;
  text-align: center;
  font-size: 12pt;
  color: #666;
}

#ses-question {
  width: 92vw;
  max-width: 700px;
  margin: 2vh auto 3vh auto;
  font-size: 17pt;
  line-height: 1.45;
  font-weight: 600;
  text-align: center;
  overflow-wrap: anywhere;
}

#ses-options {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.6vh;
  width: 100%;
  padding-bottom: 5vh;
}

.ses-option {
  width: 92vw;
  max-width: 560px;
  min-height: 8vh;
  /* jsPsych's stylesheet has no global border-box, so padding + border would
     otherwise push 92vw past the viewport and give the page a sideways scroll */
  box-sizing: border-box;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  font-size: 15pt;
  line-height: 1.35;
  border: 2px solid #ccc;
  border-radius: 14px;
  background-color: #ffffff;
  overflow-wrap: anywhere;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.ses-option:active {
  background-color: #d8e6f5;
  border-color: #4a90d9;
}

@media (hover: hover) {
  .ses-option:hover {
    border-color: #4a90d9;
  }
}

.ses-letter {
  flex: 0 0 auto;
  font-weight: 700;
  color: #4a90d9;
}

/* consent-style options: no letter badge, centred text */
.ses-option-wide .ses-text {
  width: 100%;
  text-align: center;
}

.eo-form {
  width: 92vw;
  max-width: 560px;
  margin: 4vh auto 6vh auto;
  text-align: left;
}

.eo-form-preamble {
  font-size: 14pt;
  line-height: 1.5;
  margin-bottom: 3vh;
  text-align: center;
}

.eo-field {
  margin-bottom: 2.4vh;
}

.eo-field label {
  display: block;
  font-size: 14pt;
  line-height: 1.35;
  margin-bottom: 8px;
}

/* 16px minimum: anything smaller makes iOS Safari zoom the viewport on focus.
   Selector is scoped to .jspsych-display-element to outrank the stock
   `.jspsych-display-element input[type=text] { font-size: 14px }` rule. */
.jspsych-display-element .eo-form input,
.jspsych-display-element .eo-form select {
  width: 100%;
  box-sizing: border-box;
  font-size: 16px;
  padding: 12px;
  border: 2px solid #ccc;
  border-radius: 12px;
  background-color: #ffffff;
  color: black;
}

.eo-field-invalid input,
.eo-field-invalid select {
  border-color: #b00;
}

.eo-form-error {
  color: #b00;
  font-size: 13pt;
  min-height: 1.4em;
  text-align: center;
}

.eo-form-actions {
  text-align: center;
  margin-top: 2vh;
}

@media (min-width: 900px) {
  #ses-question { font-size: 20pt; }
  .ses-option { width: 560px; font-size: 17pt; min-height: 56px; }
  .eo-form { width: 560px; }
}

.maze-finish-message {
  max-width: 65ch;
  margin: 24px auto 12px auto;
  padding: 14px 18px;
  background: #ffffff;
  border: 2px solid #ccc;
  border-radius: 12px;
  font-size: 13pt;
  line-height: 1.5;
  text-align: center;
}

/* The participation code, which the participant has to keep to claim the drink.
   Same box as the finish message, warmer, with the code big enough to survive a
   screenshot scaled down in a messaging app. */
.maze-drink-notice {
  max-width: 65ch;
  margin: 12px auto;
  padding: 14px 18px;
  background: #fffaf0;
  border: 2px solid #e0b050;
  border-radius: 12px;
  font-size: 13pt;
  line-height: 1.5;
  text-align: center;
  box-sizing: border-box;
}

.maze-drink-code {
  font-family: monospace;
  font-size: 26px;
  font-weight: bold;
  letter-spacing: 3px;
  word-break: break-all;
  /* one long-press selects the whole code, for participants who copy it
     instead of taking a screenshot */
  -webkit-user-select: all;
  user-select: all;
  margin: 14px 0;
  padding: 10px 6px;
  background: #ffffff;
  border: 1px dashed #b08020;
  border-radius: 8px;
}

#jspsych-data-display {
  max-width: 95vw;
  overflow-x: auto;
  font-size: 11px;
  background: #fff;
  border: 1px solid #ddd;
  padding: 10px;
}

</style>

                      key: side === "left" ? trial.choices[0] : trial.choices[1],
                      rt: Math.round(performance.now() - start_time),
                  }, "touch");
              };
              display_element.querySelector("#maze-option-left").addEventListener("click", tap_response("left"));
              display_element.querySelector("#maze-option-right").addEventListener("click", tap_response("right"));
          }
          // hide stimulus if stimulus_duration is set
          if (trial.stimulus_duration !== null) {
              this.jsPsych.pluginAPI.setTimeout(() => {
                  display_element.querySelector("#jspsych-html-keyboard-response-stimulus").style.visibility = "hidden";
              }, trial.stimulus_duration);
          }
          // end trial if trial_duration is set
          if (trial.trial_duration !== null) {
              this.jsPsych.pluginAPI.setTimeout(end_trial, trial.trial_duration);
          }
      }
      simulate(trial, simulation_mode, simulation_options, load_callback) {
          if (simulation_mode == "data-only") {
              load_callback();
              this.simulate_data_only(trial, simulation_options);
          }
          if (simulation_mode == "visual") {
              this.simulate_visual(trial, simulation_options, load_callback);
          }
      }
      create_simulation_data(trial, simulation_options) {
          const default_data = {
              stimulus: trial.stimulus,
              rt: this.jsPsych.randomization.sampleExGaussian(500, 50, 1 / 150, true),
              response: this.jsPsych.pluginAPI.getValidKey(trial.choices),
          };
          const data = this.jsPsych.pluginAPI.mergeSimulationData(default_data, simulation_options);
          this.jsPsych.pluginAPI.ensureSimulationDataConsistency(trial, data);
          return data;
      }
      simulate_data_only(trial, simulation_options) {
          const data = this.create_simulation_data(trial, simulation_options);
          this.jsPsych.finishTrial(data);
      }
      simulate_visual(trial, simulation_options, load_callback) {
          const data = this.create_simulation_data(trial, simulation_options);
          const display_element = this.jsPsych.getDisplayElement();
          this.trial(display_element, trial);
          load_callback();
          if (data.rt !== null) {
              this.jsPsych.pluginAPI.pressKey(data.response, data.rt);
          }
      }
  }
  HtmlKeyboardResponsePlugin.info = info;

  return HtmlKeyboardResponsePlugin;

})(jsPsychModule);

</script>
<script>
// jsPsychChoiceButtons — first-party plugin (not vendored).
//
// A question with N large, stacked, tappable options. Used for the SES-test items,
// the consent screen, and the multiple-choice background questions.
//
// Deliberately mirrors vendor/plugin-maze-keyboard.js: same IIFE-over-jsPsychModule
// shape, same "record the first response only" guard, same response_source bookkeeping
// ("touch" vs "key"), so reaction times stay comparable across phases.

var jsPsychChoiceButtons = (function (jspsych) {
  'use strict';

  const info = {
    name: "choice-buttons",
    parameters: {
      /** The question, shown above the options. */
      prompt: {
        type: jspsych.ParameterType.HTML_STRING,
        pretty_name: "Prompt",
        default: "",
      },
      /** Array of option texts, rendered top to bottom. */
      choices: {
        type: jspsych.ParameterType.HTML_STRING,
        pretty_name: "Choices",
        array: true,
        default: undefined,
      },
      /**
       * Optional badge shown at the start of each option (e.g. ["A","B","C","D"]).
       * When present, single-letter badges also become keyboard shortcuts on desktop.
       */
      labels: {
        type: jspsych.ParameterType.STRING,
        pretty_name: "Labels",
        array: true,
        default: null,
      },
      /** Small line above the question, e.g. "Demando 3 el 25". */
      header: {
        type: jspsych.ParameterType.HTML_STRING,
        pretty_name: "Header",
        default: null,
      },
      /** Progress bar pinned to the top of the screen; both must be set to show it. */
      progress: {
        type: jspsych.ParameterType.INT,
        pretty_name: "Progress",
        default: null,
      },
      progress_max: {
        type: jspsych.ParameterType.INT,
        pretty_name: "Progress max",
        default: null,
      },
      /** CSS class applied to each option div. */
      option_class: {
        type: jspsych.ParameterType.STRING,
        pretty_name: "Option class",
        default: "ses-option",
      },
    },
  };

  class ChoiceButtonsPlugin {
    constructor(jsPsych) {
      this.jsPsych = jsPsych;
    }

    trial(display_element, trial) {
      var new_html = "";

      if (trial.progress !== null && trial.progress_max !== null) {
        new_html +=
          '<relative><progress id="progress_bar" value="' + trial.progress +
          '" max="' + trial.progress_max + '"></progress></relative>';
      }
      if (trial.header !== null) {
        new_html += '<div id="ses-header">' + trial.header + "</div>";
      }
      new_html += '<div id="ses-question">' + trial.prompt + "</div>";

      new_html += '<div id="ses-options">';
      for (var i = 0; i < trial.choices.length; i++) {
        var badge = "";
        if (trial.labels !== null && trial.labels[i]) {
          badge = '<span class="ses-letter">' + trial.labels[i] + "</span>";
        }
        new_html +=
          '<div class="' + trial.option_class + '" data-choice="' + i + '">' +
          badge + '<span class="ses-text">' + trial.choices[i] + "</span></div>";
      }
      new_html += "</div>";

      // draw
      display_element.innerHTML = new_html;
      var start_time = performance.now();

      // store response
      var response = {
        rt: null,
        index: null,
        source: null,
      };

      const end_trial = () => {
        this.jsPsych.pluginAPI.clearAllTimeouts();
        if (typeof keyboardListener !== "undefined") {
          this.jsPsych.pluginAPI.cancelKeyboardResponse(keyboardListener);
        }
        var trial_data = {
          rt: response.rt,
          response: response.index,
          response_label:
            response.index === null || trial.labels === null
              ? null
              : trial.labels[response.index],
          response_text:
            response.index === null ? null : trial.choices[response.index],
          response_source: response.source,
        };
        display_element.innerHTML = "";
        this.jsPsych.finishTrial(trial_data);
      };

      // only the first response counts, whether it arrives by tap or by key
      var after_response = (index, rt, source) => {
        if (response.index !== null) {
          return;
        }
        response = { rt: Math.round(rt), index: index, source: source };
        var chosen = display_element.querySelector('[data-choice="' + index + '"]');
        if (chosen) {
          chosen.className += " responded";
        }
        end_trial();
      };

      // touch / click
      var option_nodes = display_element.querySelectorAll("#ses-options [data-choice]");
      for (var n = 0; n < option_nodes.length; n++) {
        (function (node) {
          node.addEventListener("click", function (e) {
            e.preventDefault();
            after_response(
              parseInt(node.getAttribute("data-choice"), 10),
              performance.now() - start_time,
              "touch"
            );
          });
        })(option_nodes[n]);
      }

      // keyboard shortcuts on desktop, when the badges are single letters/digits
      var keys = [];
      if (trial.labels !== null) {
        for (var k = 0; k < trial.labels.length; k++) {
          if (typeof trial.labels[k] === "string" && trial.labels[k].length === 1) {
            keys.push(trial.labels[k]);
          }
        }
      }
      if (keys.length === trial.choices.length && keys.length > 0) {
        var keyboardListener = this.jsPsych.pluginAPI.getKeyboardResponse({
          callback_function: (info) => {
            for (var j = 0; j < keys.length; j++) {
              if (this.jsPsych.pluginAPI.compareKeys(info.key, keys[j])) {
                after_response(j, info.rt, "key");
                return;
              }
            }
          },
          valid_responses: keys,
          rt_method: "performance",
          persist: false,
          allow_held_key: false,
        });
      }
    }
  }

  ChoiceButtonsPlugin.info = info;

  return ChoiceButtonsPlugin;
})(jsPsychModule);

</script>
<script>
// jsPsychEoForm — first-party plugin (not vendored).
//
// One screen holding a short vertical questionnaire, sized for a phone: full-width
// fields, 16px input font (anything smaller makes iOS Safari zoom the viewport on
// focus), one thumb-sized submit button. Each field's value is written into the trial
// data under its `name`.
//
// Field shape:
//   { name, label, type: "text" | "number" | "select", options: [{value,label}],
//     required: true, min, max, placeholder, inputmode }

var jsPsychEoForm = (function (jspsych) {
  'use strict';

  const info = {
    name: "eo-form",
    parameters: {
      /** HTML shown above the fields. */
      preamble: {
        type: jspsych.ParameterType.HTML_STRING,
        pretty_name: "Preamble",
        default: "",
      },
      /** Array of field descriptors; see the header comment for the shape. */
      fields: {
        type: jspsych.ParameterType.OBJECT,
        pretty_name: "Fields",
        array: true,
        default: undefined,
      },
      button_label: {
        type: jspsych.ParameterType.STRING,
        pretty_name: "Button label",
        default: "Sekva",
      },
      /** Shown when a required field is left empty. */
      error_message: {
        type: jspsych.ParameterType.HTML_STRING,
        pretty_name: "Error message",
        default: "Bonvolu respondi ĉiujn demandojn.",
      },
      /** Placeholder entry at the top of every select. */
      select_placeholder: {
        type: jspsych.ParameterType.STRING,
        pretty_name: "Select placeholder",
        default: "— elektu —",
      },
    },
  };

  function escape_attr(s) {
    return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
  }

  class EoFormPlugin {
    constructor(jsPsych) {
      this.jsPsych = jsPsych;
    }

    trial(display_element, trial) {
      var new_html = '<div class="eo-form">';
      if (trial.preamble) {
        new_html += '<div class="eo-form-preamble">' + trial.preamble + "</div>";
      }

      trial.fields.forEach(function (f, i) {
        var id = "eo-field-" + i;
        new_html += '<div class="eo-field" data-field="' + i + '">';
        new_html += '<label for="' + id + '">' + f.label + "</label>";

        if (f.type === "select") {
          new_html += '<select id="' + id + '">';
          new_html += '<option value="" selected>' + trial.select_placeholder + "</option>";
          f.options.forEach(function (o) {
            new_html +=
              '<option value="' + escape_attr(o.value) + '">' + o.label + "</option>";
          });
          new_html += "</select>";
        } else {
          var attrs = 'id="' + id + '" type="' + (f.type === "number" ? "number" : "text") + '"';
          if (f.type === "number") {
            attrs += ' inputmode="numeric"';
            if (typeof f.min === "number") attrs += ' min="' + f.min + '"';
            if (typeof f.max === "number") attrs += ' max="' + f.max + '"';
          }
          if (f.inputmode) attrs += ' inputmode="' + escape_attr(f.inputmode) + '"';
          if (f.placeholder) attrs += ' placeholder="' + escape_attr(f.placeholder) + '"';
          attrs += ' autocomplete="off" autocorrect="off" autocapitalize="none"';
          new_html += "<input " + attrs + " />";
        }
        new_html += "</div>";
      });

      new_html += '<div id="eo-form-error" class="eo-form-error"></div>';
      new_html +=
        '<div class="eo-form-actions"><button type="button" id="eo-form-submit" ' +
        'class="jspsych-btn">' + trial.button_label + "</button></div>";
      new_html += "</div>";

      display_element.innerHTML = new_html;
      var start_time = performance.now();

      const read_value = (f, i) => {
        var el = display_element.querySelector("#eo-field-" + i);
        var v = el === null ? "" : el.value;
        return typeof v === "string" ? v.trim() : v;
      };

      const submit = () => {
        var values = {};
        var first_invalid = null;

        trial.fields.forEach(function (f, i) {
          var v = read_value(f, i);
          var wrapper = display_element.querySelector('[data-field="' + i + '"]');
          var invalid = false;

          if (f.required !== false && v === "") {
            invalid = true;
          } else if (f.type === "number" && v !== "") {
            var n = Number(v);
            if (
              isNaN(n) ||
              (typeof f.min === "number" && n < f.min) ||
              (typeof f.max === "number" && n > f.max)
            ) {
              invalid = true;
            } else {
              v = n;
            }
          }

          if (invalid) {
            wrapper.className = "eo-field eo-field-invalid";
            if (first_invalid === null) first_invalid = wrapper;
          } else {
            wrapper.className = "eo-field";
          }
          values[f.name] = v;
        });

        var err = display_element.querySelector("#eo-form-error");
        if (first_invalid !== null) {
          err.innerHTML = trial.error_message;
          first_invalid.scrollIntoView({ block: "center" });
          return;
        }
        err.innerHTML = "";

        var trial_data = { rt: Math.round(performance.now() - start_time) };
        for (var k in values) {
          if (Object.prototype.hasOwnProperty.call(values, k)) {
            trial_data[k] = values[k];
          }
        }
        display_element.innerHTML = "";
        this.jsPsych.finishTrial(trial_data);
      };

      display_element
        .querySelector("#eo-form-submit")
        .addEventListener("click", function (e) {
          e.preventDefault();
          submit();
        });
    }
  }

  EoFormPlugin.info = info;

  return EoFormPlugin;
})(jsPsychModule);

</script>

<script>
// Intake phase: consent -> background questions -> SES-test (25 items).
//
// Defines functions only. The jsPsych instance is created in maze_experiment_2cond.js,
// which is inlined after this file and calls build_intake_timeline(jsPsych).

// ---------------------------------------------------------------------------
// Shown on the consent screen. Both are set; change them only if the study
// moves institution or contact address.
// ---------------------------------------------------------------------------
var STUDY_INSTITUTION = "Universitato de Pocdamo";
var STUDY_CONTACT_EMAIL = "vrazitulis@uni-potsdam.de";

// Set by the consent trial; read by on_finish in maze_experiment_2cond.js.
var CONSENT_DECLINED = false;

// ---------------------------------------------------------------------------
// Sanity check on the item bank. Fails loudly at load rather than silently
// mis-scoring a whole data set.
// ---------------------------------------------------------------------------
(function check_ses_items() {
  if (typeof ses_items === "undefined") {
    throw new Error("ses_test_items.js must be loaded before ses_phase.js");
  }
  if (ses_items.length !== 25) {
    throw new Error("SES: expected 25 items, got " + ses_items.length);
  }
  ses_items.forEach(function (it, i) {
    var letters = ["A", "B", "C", "D"];
    if (it.id !== i + 1) {
      throw new Error("SES: item at index " + i + " has id " + it.id);
    }
    letters.forEach(function (L) {
      if (typeof it.options[L] !== "string" || it.options[L] === "") {
        throw new Error("SES: item " + it.id + " is missing option " + L);
      }
    });
    if (Object.keys(it.options).length !== 4) {
      throw new Error("SES: item " + it.id + " does not have exactly 4 options");
    }
    if (letters.indexOf(it.key) === -1) {
      throw new Error("SES: item " + it.id + " has bad key " + it.key);
    }
  });
})();

// ---------------------------------------------------------------------------

var SES_LETTERS = ["A", "B", "C", "D"];

// Consent + background questions. Always runs first, whatever SES_POSITION is.
function build_consent_timeline(jsPsych) {
  var tl = [];

  // ---- consent ----

  tl.push({
    type: jsPsychChoiceButtons,
    data: { trial1: "consent" },
    prompt:
      "<b>Informoj pri la esploro</b><br/><br/>" +
      "Ni invitas vin partopreni en lingvoscienca esploro pri legado en Esperanto ĉe la " +
      STUDY_INSTITUTION + ".<br/><br/>" +
      "La partopreno daŭras ĉirkaŭ <b>20&ndash;25 minutojn</b> kaj konsistas el tri partoj: " +
      "kelkaj mallongaj demandoj pri vi, lingva testo, kaj legekzerco.<br/><br/>" +
      "La partopreno estas <b>tute libervola</b>. Vi rajtas ĉesi iam ajn, simple fermante " +
      "la retpaĝon, sen ia ajn malavantaĝo por vi. La respondoj, kiujn vi jam donis " +
      "ĝis tiu momento, restas anonime konservitaj kaj povas esti uzataj.<br/><br/>" +
      "Ni kolektas <b>neniun personan identigilon</b> &mdash; nek nomon, nek retadreson, " +
      "nek IP-adreson. Viaj respondoj estas konservataj anonime kaj uzataj nur por " +
      "sciencaj celoj.<br/><br/>" +
      "Se vi havas demandojn, skribu al: " +
      '<a href="mailto:' + STUDY_CONTACT_EMAIL + '">' + STUDY_CONTACT_EMAIL + "</a>",
    choices: ["Mi konsentas kaj volas partopreni", "Mi ne konsentas"],
    option_class: "ses-option ses-option-wide",
    on_finish: function (data) {
      data.consent = data.response === 0 ? "yes" : "no";
      jsPsych.data.addProperties({ consent: data.consent });
      if (data.response !== 0) {
        CONSENT_DECLINED = true;
        // the message must be handed to endExperiment: jsPsych overwrites the display
        // element with `end_message` *after* the global on_finish has run
        jsPsych.endExperiment(
          '<div class="maze-finish-message"><b>Dankon pro via intereso.</b><br/><br/>' +
            "Vi povas nun fermi la paĝon.</div>"

      }
    },
  });

  // ---- background questions ----

  tl.push({
    type: jsPsychEoForm,
    data: { trial1: "background" },
    preamble:
      "<b>Kelkaj demandoj pri vi</b><br/><br/>" +

    button_label: "Daŭrigi",

    fields: [

        name: "age",
        label: "Kiom aĝa vi estas?",
        type: "number",
        min: 10,
        max: 120,
        placeholder: "ekz. 34",
      },
      {
        name: "gender",
        label: "Kiu estas via genro?",
        type: "select",
        options: [
          { value: "ina", label: "Ina" },
          { value: "ica", label: "Iĉa (vira)" },
          { value: "alia", label: "Alia" },

      },
      {
        name: "native_language",
        label: "Kiu estas via denaska lingvo (aŭ lingvoj)?",
        type: "text",
        placeholder: "ekz. hungara, germana",
      },
      {
        name: "denaskulo",
        label: "Ĉu vi estas denaska Esperanto-parolanto (vi lernis ĝin en la familio)?",
        type: "select",
        options: [
          { value: "jes", label: "Jes" },
          { value: "ne", label: "Ne" },
        ],
      },
      {
        name: "years_esperanto",
        label: "De kiom da jaroj vi scipovas Esperanton?",
        type: "number",
        min: 0,
        max: 100,
        placeholder: "ekz. 7",
      },
      {
        name: "self_rated_level",
        label: "Kiel vi taksas vian nivelon en Esperanto?",
        type: "select",
        options: [
          { value: "komencanto", label: "Komencanto" },
          { value: "malaltmeza", label: "Malalta meza nivelo" },
          { value: "meza", label: "Meza nivelo" },
          { value: "altmeza", label: "Alta meza nivelo" },
          { value: "altnivela", label: "Altnivela" },
        ],
      },
    ],
    on_finish: function (data) {
      jsPsych.data.addProperties({
        age: data.age,
        gender: data.gender,
        native_language: data.native_language,
        denaskulo: data.denaskulo,
        years_esperanto: data.years_esperanto,
        self_rated_level: data.self_rated_level,
      });
    },
  });

  return tl;
}

// The SES-test itself: instructions, the 25 items, scoring, and a bridge screen.
// `position` is "before" or "after" (relative to the maze) and only changes wording.
function build_ses_timeline(jsPsych, position) {
  var tl = [];
  var LETTERS = SES_LETTERS;

  // ---- SES instructions ----

  tl.push({
    type: jsPsychInstructions,
    data: { trial1: "instructions" },
    pages: [
      (position === "before" ? "<b>Unua parto: lingva testo</b>" : "<b>Lasta parto: lingva testo</b>") +
        "<br/><br/>" +
        (position === "before"
          ? "Antaŭ la ĉefa parto ni petas vin fari mallongan <b>lingvan teston</b>.<br/><br/>"
          : "Restas ankoraŭ mallonga <b>lingva testo</b>.<br/><br/>") +
        "Vi vidos <b>25 frazojn</b>. En ĉiu frazo io mankas. Sub la frazo aperos " +
        "<b>kvar proponoj</b>. <b>Tuŝu</b> tiun, kiu estas " +
        "<b>ĝusta</b>.<br/><br/>" +
        "Estas nur <b>unu</b> ĝusta respondo. Se vi ne certas, elektu tiun, kiu ŝajnas al " +
        "vi la plej bona.",
      "Bonvolu <b>ne uzi vortarojn nek aliajn helpilojn</b>. Ni volas mezuri vian " +
        "propran spontanean lingvokonon.<br/><br/>" +
        "Ne eblas reveni al antaŭa demando.<br/><br/>" +
        "Ĉi tiu parto daŭras ĉirkaŭ <b>5&ndash;8 minutojn</b>.",
    ],
    show_clickable_nav: true,
    allow_backward: true,
    allow_keys: false,
    button_label_next: "Sekva",
    button_label_previous: "Antaŭa",
  });

  // ---- the 25 items ----

  ses_items.forEach(function (item, idx) {
    tl.push({
      type: jsPsychChoiceButtons,
      data: { trial1: "ses" },
      header: "Demando " + (idx + 1) + " el " + ses_items.length,
      prompt: item.prompt,
      choices: LETTERS.map(function (L) {
        return item.options[L];
      }),
      labels: LETTERS,
      progress: idx + 1,
      progress_max: ses_items.length,
      on_finish: function (data) {
        data.ses_item = item.id;
        data.ses_response = data.response_label;
        // the key travels with the data so the CSV can be re-scored without this file
        data.ses_key = item.key;
        data.ses_correct = data.response_label === item.key ? 1 : 0;
      },
    });
  });

  // ---- score, then hand over to the maze ----

  tl.push({
    type: jsPsychInstructions,
    data: { trial1: "instructions" },
    on_start: function () {
      var rows = jsPsych.data.get().filter({ trial1: "ses" });
      jsPsych.data.addProperties({
        ses_score: rows.filter({ ses_correct: 1 }).count(),
        ses_n: rows.count(),
      });
      // silent checkpoint (defined in maze_experiment_2cond.js): proficiency data
      // survives a drop-out during the maze. Nothing is shown and nothing waits —
      // this screen must not read as the end of the session.
      if (position === "before" && typeof upload_checkpoint === "function") {
        upload_checkpoint();
      }
    },
    pages: [
      "Fino de la lingva testo &mdash; dankon!<br/><br/>" +
        (position === "before"
          ? "Nun sekvos la <b>ĉefa parto</b>, la legekzerco."
          : "Tio estis la lasta parto."),
    ],
    show_clickable_nav: true,
    allow_backward: false,
    allow_keys: false,
    button_label_next: "Daŭrigi",
  });

  return tl;
}

// test) built in ses_phase.js. One link, one data set.

// ---------------- configuration ----------------

// Where the SES-test sits relative to the maze. "before" is what was asked for;
// "after" is the more conservative option (a 25-item grammar test before a
// reading-time task adds fatigue and primes explicit grammaticality judgements).
var SES_POSITION = "before";   // "before" | "after"

// DataPipe experiment ID (https://pipe.jspsych.org, linked to an OSF component in
// data-collection mode). Leave empty to skip the upload entirely and go straight to
// the CSV download screen — which is what you want when testing over file://.
var DATAPIPE_EXPERIMENT_ID = "WQoFwWH1OwBX";

var DATAPIPE_URL = "https://pipe.jspsych.org/api/data/";
var DATAPIPE_CONDITION_URL = "https://pipe.jspsych.org/api/condition/";

// Upload attempts before the participant is shown anything at all. A phone on a
// flaky connection routinely needs a second try; three is enough that the fallback
// screen means something is really wrong.
var UPLOAD_ATTEMPTS = 3;

// Main sentences per block. Drives the break screens, the checkpoint uploads and
// the block count quoted in the instructions, so change it in one place only.
var BREAK_EVERY = 24;

// ---------------- data saving ----------------

function render_finish(html) {
  jsPsych.getDisplayElement().innerHTML = html;
}

// ---------------- drink code ----------------
//
// The recruitment promise is a drink for taking part, redeemed in person. Showing
// the subject_id for that would tie a face to a row of data, so the drink code is a
// SEPARATE identifier: drawn from fresh randomness, never written into the data
// set, never uploaded, and shown only on the finish screen. Nothing anywhere
// records which drink code went with which run, so handing one over at the bar
// reveals nothing about that participant's responses.
//
// It still has to be checkable, or anyone could invent a code. The last three
// characters are a keyed checksum over the first six, so a made-up string is
// almost certainly rejected: tools/verify_drink_code.py recomputes it. The salt
// sits in the page, which anyone can read, so this stops casual invention rather
// than a determined forger. For the stakes involved that is the right trade.
var DRINK_ALPHABET = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";  // no O/0/I/1/L
var DRINK_SALT = "eo-maze-trinkajxo-2026";
var DRINK_PAYLOAD_LEN = 6;
var DRINK_CHECK_LEN = 3;

// FNV-1a, 32-bit. Kept to integer ops that JavaScript and Python agree on, so the
// verifier can reproduce it exactly.
function drink_checksum(payload) {
  var s = DRINK_SALT + payload;
  var h = 0x811c9dc5;
  for (var i = 0; i < s.length; i++) {
    h = (h ^ s.charCodeAt(i)) >>> 0;
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  var out = "";
  for (var k = 0; k < DRINK_CHECK_LEN; k++) {
    out += DRINK_ALPHABET.charAt(h % DRINK_ALPHABET.length);
    h = Math.floor(h / DRINK_ALPHABET.length);
  }
  return out;
}

// crypto.getRandomValues, not Math.random: the list-assignment fallback is the
// first Math.random() call on the page and a test harness stubs it, so drawing
// the code from that stream would both skew the code and break the harness.
function make_drink_code() {
  var n = DRINK_PAYLOAD_LEN;
  var r = new Uint32Array(n);
  if (window.crypto && window.crypto.getRandomValues) {
    window.crypto.getRandomValues(r);
  } else {
    for (var i = 0; i < n; i++) r[i] = Math.floor(Math.random() * 4294967296);
  }
  var payload = "";
  for (var j = 0; j < n; j++) {
    payload += DRINK_ALPHABET.charAt(r[j] % DRINK_ALPHABET.length);
  }
  return payload + "-" + drink_checksum(payload);
}

// Generated on first display and held in a local variable only: a reload issues a
// new code, which costs nothing, and no copy is kept for the data to pick up.
var DRINK_CODE = null;
function drink_notice() {
  if (!DRINK_CODE) DRINK_CODE = make_drink_code();
  return (
    '<div class="maze-drink-notice">' +
    '<b>Kaj nun la trinkaĵo!</b><br/><br/>' +
    'Mi promesis pagi trinkaĵon al ĉiu, kiu partoprenis. Jen via kodo:' +
    '<div class="maze-drink-code">' + DRINK_CODE + '</div>' +
    'Vi povas fari <b>ekrankopion de ĉi tiu paĝo</b> aŭ simple <b>kopii la kodon</b>, ' +
    'kaj montri ĝin al mi en la trinkejo. ' +
    'Ĝi estas anonima kaj ne estas konservita kun viaj respondoj, do mi ne povas ' +
    'vidi, kiuj respondoj estas viaj.<br/><br/>' +
    'Post la fermo de la paĝo la kodo ne plu videblos.<br/><br/>' +
    'Mi estas <b>Michael Vrazitulis el Germanio</b>. Se vi ne trovas min en la ' +
    'trinkejo, kontaktu min: <a href="mailto:' + STUDY_CONTACT_EMAIL + '">' +
    STUDY_CONTACT_EMAIL + '</a> aŭ per Telegram <b>@mixalhs</b>.' +
    '</div>'
  );
}

// CSV fallback: shown when there is no DataPipe ID, or when every upload attempt
// failed. On a configured build the participant never reaches this screen.
function show_csv_fallback(reason) {
  render_finish(
    '<div class="maze-finish-message"><b>Fino de la eksperimento &mdash; koran dankon!</b><br/><br/>' +
    (reason ? '<span style="color:#b00">' + reason + '</span><br/><br/>' : '') +
    'Se vi volas, vi povas <b>elŝuti la datumojn</b> kaj sendi la dosieron al ' +
    '<a href="mailto:' + STUDY_CONTACT_EMAIL + '">' + STUDY_CONTACT_EMAIL + '</a>. ' +
    'Tio estas tute libervola.</div>' +
    drink_notice() +
    '<div style="text-align:center; margin-top:16px;">' +
    '<button id="download-btn" class="jspsych-btn">Elŝuti la datumojn (CSV)</button> ' +
    '<button id="show-btn" class="jspsych-btn">Montri la datumojn</button> ' +
    (DATAPIPE_EXPERIMENT_ID ? '<button id="retry-btn" class="jspsych-btn">Reprovi sendi</button>' : '') +
    '</div>' +
    '<pre id="csv-view" style="display:none; max-width:95vw; overflow-x:auto; font-size:11px; background:#fff; border:1px solid #ddd; padding:10px;"></pre>'
  );
  document.getElementById('download-btn').addEventListener('click', function() {
    jsPsych.data.get().localSave('csv', 'eo_' + SUBJECT_ID + '.csv');
  });
  document.getElementById('show-btn').addEventListener('click', function() {
    var pre = document.getElementById('csv-view');
    pre.textContent = jsPsych.data.get().csv();
    pre.style.display = 'block';
  });
  var retry = document.getElementById('retry-btn');
  if (retry) retry.addEventListener('click', function() { save_data(1); });
}

// Silent checkpoint upload. A participant who abandons the run mid-maze still
// leaves behind everything collected up to the last checkpoint, instead of nothing.
//
// Deliberately invisible: no screen, no waiting, no message. It fires while a
// screen the participant is already looking at is up, and failures are swallowed —
// the final upload carries the complete data set anyway, so a lost checkpoint
// costs nothing. Nothing here may ever suggest the session is over.
var CHECKPOINT_N = 0;
function upload_checkpoint() {
  if (!DATAPIPE_EXPERIMENT_ID || !SUBJECT_ID) return;
  CHECKPOINT_N += 1;
  try {
    // no `keepalive`: the page is not unloading, and it would cap the body at 64 kB
    fetch(DATAPIPE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': '*/*' },
      body: JSON.stringify({
        experimentID: DATAPIPE_EXPERIMENT_ID,
        filename: 'eo_' + SUBJECT_ID + '_p' + CHECKPOINT_N + '.csv',
        data: jsPsych.data.get().csv()
      })
    }).catch(function() {});
  } catch (e) {
    // a checkpoint must never be able to interrupt the run
  }
}

function post_data() {
  return fetch(DATAPIPE_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': '*/*' },
    body: JSON.stringify({
      experimentID: DATAPIPE_EXPERIMENT_ID,
      filename: 'eo_' + SUBJECT_ID + '.csv',
      data: jsPsych.data.get().csv()
    })
  }).then(function(res) {
    // DataPipe reports some failures as {error: true, message} with a 200, so check both
    return res.json().catch(function() { return {}; }).then(function(body) {
      if (!res.ok || body.error) {
        throw new Error(body.message || ('HTTP ' + res.status));
      }
    });
  });
}

// Retries stay invisible: the "sending" screen is rendered once and left up until
// the upload either succeeds or has run out of attempts.
function save_data(attempt) {
  if (!DATAPIPE_EXPERIMENT_ID) {
    show_csv_fallback(null);
    return;
  }
  if (attempt === 1) {
    render_finish(
      '<div class="maze-finish-message"><b>Sendado de la datumoj&hellip;</b><br/><br/>' +
      'Bonvolu <b>ne fermi la paĝon</b>.</div>'
    );
  }
  post_data().then(function() {
    render_finish(
      '<div class="maze-finish-message"><b>Fino de la eksperimento &mdash; koran dankon!</b><br/><br/>' +
      'Viaj respondoj estas sekure konservitaj. Vi povas nun fermi la paĝon.</div>' +
      drink_notice()
    );
  }).catch(function(err) {
    if (attempt < UPLOAD_ATTEMPTS) {
      setTimeout(function() { save_data(attempt + 1); }, 1000 * attempt);
      return;
    }
    show_csv_fallback('La aŭtomata sendado malsukcesis (' + err.message + ').');
  });
}

var jsPsych = initJsPsych({
  on_finish: function() {
    // no consent, no data: the goodbye screen is jsPsych's end_message, set by the
    // consent trial itself, so nothing is rendered or uploaded here
    if (CONSENT_DECLINED) {
      return;
    }
    save_data(1);
  }
});

// ---------------- list assignment + design ----------------

// Filled in by start(); save_data() and the trial builders read them.
var LIST, SUBJECT_ID, selected_items, sentence_order, total_words;

// DataPipe hands out conditions from a counter, so the two lists stay balanced
// across participants. Without an experiment ID (local testing, file://) or when
// the request fails, fall back to a coin flip; `list_source` records which of the
// two actually happened, so a lopsided split can be told from a broken endpoint.
//
// The fallback draw is the first Math.random() call on the page, which is what a
// test harness stubs to force a list.
function assign_list(done) {
  if (!DATAPIPE_EXPERIMENT_ID) {
    done(Math.random() < 0.5 ? 1 : 2, "random");
    return;
  }
  // jsPsych has not rendered anything yet, so without this the first screen of the
  // experiment is a blank page for as long as the request takes
  document.body.innerHTML =
    '<div class="maze-finish-message" style="margin-top:40vh">Momenton&hellip;</div>';
  var settled = false;
  function finish(list, source) {
    if (settled) return;
    settled = true;
    done(list, source);
  }
  // a hung request must not strand the participant on the loading screen
  setTimeout(function() { finish(Math.random() < 0.5 ? 1 : 2, "random"); }, 8000);
  fetch(DATAPIPE_CONDITION_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': '*/*' },
    body: JSON.stringify({ experimentID: DATAPIPE_EXPERIMENT_ID })
  }).then(function(res) {
    return res.json().catch(function() { return {}; });
  }).then(function(body) {
    // conditions are 0-based; anything else means the experiment is misconfigured
    if (body.error || typeof body.condition !== 'number') {
      throw new Error(body.message || 'no condition returned');
    }
    finish(body.condition + 1, "datapipe");
  }).catch(function() {
    finish(Math.random() < 0.5 ? 1 : 2, "random");
  });
}

// order: shuffle items+fillers with >=1 filler between any two items
function make_order() {
  var all = selected_items.concat(maze_fillers);
  for (var tries = 0; tries < 2000; tries++) {
    var shuffled = jsPsych.randomization.shuffle(all);
    var ok = true;
    for (var i = 1; i < shuffled.length; i++) {
      if (shuffled[i].type === "item" && shuffled[i - 1].type === "item") { ok = false; break; }
    }
    if (ok) return shuffled;
  }
  // greedy fallback: interleave
  var items = jsPsych.randomization.shuffle(selected_items);
  var fills = jsPsych.randomization.shuffle(maze_fillers.slice());
  var out = [];
  while (items.length || fills.length) {
    if (fills.length) out.push(fills.shift());
    if (items.length) out.push(items.shift());
    if (fills.length) out.push(fills.shift());
  }
  return out;
}

// ---------------- trial builders ----------------

function maze_word_trial(sent, w, w_idx, tally) {
  // Sides are drawn once per word, not per presentation: the redo loop replays
  // this same trial, and re-drawing would move the correct word under the finger
  // that just tapped the wrong one. Holds for the "x-x-x" first slot too.
  var sides = jsPsych.randomization.shuffle([w.t, w.d]);
  return {
    type: jsPsychMazeKeyboard,
    prompt: '<relative><progress id="progress_bar" value="' + tally + '" max="' + total_words + '"></progress></relative>',
    on_start: function(trial) {
      trial.stimulus_left = sides[0]; trial.stimulus_right = sides[1];
      trial.Target = w.t; trial.Distractor = w.d;
    },
    choices: ["1", "2"],
    on_finish: function() {
      var data = jsPsych.data.get().last(1).values()[0];
      data.correct = ((jsPsych.pluginAPI.compareKeys(data.stimulus_left, data.Target) && data.response == "1") ||
                      (jsPsych.pluginAPI.compareKeys(data.stimulus_right, data.Target) && data.response == "2")) ? 1 : 0;
      rename_options(data);
      data.sentence_id = sent.id;
      data.sentence_type = sent.type;
      data.condition = sent.cond || "";
      data.region = w.r || "";
      data.word_index = w_idx + 1;
      data.trial1 = "maze";
    }
  };
}

// The plugin names its two slots left/right, but the phone layout stacks them,
// so the CSV calls them upper/lower. Renamed once the trial is scored, which is
// also before last_correct() reads the row back.
function rename_options(data) {
  data.stimulus_upper = data.stimulus_left;
  data.stimulus_lower = data.stimulus_right;
  delete data.stimulus_left;
  delete data.stimulus_right;
  // the plugin reports which key the response maps to ("1"/"2"); the CSV names
  // the slot that was chosen. Scoring above has already run on the raw value.
  data.response = data.response === "1" ? "upper" : "lower";
}

function last_correct() {
  var data = jsPsych.data.get().last(1).values()[0];
  return !((jsPsych.pluginAPI.compareKeys(data.stimulus_upper, data.Target) && data.response == "upper") ||
           (jsPsych.pluginAPI.compareKeys(data.stimulus_lower, data.Target) && data.response == "lower"));
}

var error_trial = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: "<p style='color: red; font-size: 24pt;'>x</p>",
  choices: "NO_KEYS",
  trial_duration: 350,
  data: { trial1: "error" }
};

function question_trial(sent) {
  return {
    type: jsPsychMazeKeyboard,
    prompt: sent.q.question,
    on_start: function(trial) {
      var r = jsPsych.randomization.shuffle([sent.q.target, sent.q.distractor]);
      trial.stimulus_left = r[0]; trial.stimulus_right = r[1];
      trial.Target = sent.q.target; trial.Distractor = sent.q.distractor;
    },
    choices: ["1", "2"],
    on_finish: function() {
      var data = jsPsych.data.get().last(1).values()[0];
      data.correct = ((jsPsych.pluginAPI.compareKeys(data.stimulus_left, data.Target) && data.response == "1") ||
                      (jsPsych.pluginAPI.compareKeys(data.stimulus_right, data.Target) && data.response == "2")) ? 1 : 0;
      rename_options(data);
      data.sentence_id = sent.id;
      data.sentence_type = sent.type;
      data.condition = sent.cond || "";
      // "role" questions probe who did what to whom, i.e. whether the garden
      // path was recovered from; "detail" ones probe an adverb or a reason
      data.question_type = sent.q.type || "";
      // the wording and its expected answer travel with the response, so the
      // data set can be scored without the materials file alongside it
      data.question_text = sent.q.question;
      data.question_answer = sent.q.target;
      data.trial1 = "comprehension";
    }
  };
}

var between_sentences = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: "",
  choices: "NO_KEYS",
  trial_duration: 400,
  data: { trial1: "iti" }
};

// ---------------- timeline assembly ----------------

// Everything below depends on the list, which only exists once assign_list() has
// answered, so the whole build runs inside start().
function start(list, list_source) {
  LIST = list;
  SUBJECT_ID = jsPsych.randomization.randomID(10);
  jsPsych.data.addProperties({ subject_id: SUBJECT_ID, list: LIST, list_source: list_source });

  // Latin square: item i (1-based) shown in condition a iff (i + LIST) is even
  selected_items = maze_items.filter(function(it) {
    var want = ((it.id + LIST) % 2 === 0) ? "a" : "b";
    return it.cond === want;
  });

  sentence_order = maze_practice.concat(make_order());
  total_words = sentence_order.reduce(function(s, x) { return s + x.words.length; }, 0);
  var n_main = sentence_order.length - maze_practice.length;
  var n_blocks = Math.ceil(n_main / BREAK_EVERY);
  var word_tally = 0;

  // consent + background always come first; only the SES block moves
  var timeline = build_consent_timeline(jsPsych);
  if (SES_POSITION === "before") {
    timeline = timeline.concat(build_ses_timeline(jsPsych, "before"));
  }

  timeline.push({
    type: jsPsychInstructions,
    data: { trial1: "instructions" },
    pages: [
      "<b>Bonvenon al la labirinta legeksperimento!</b><br/><br/>Vi legos frazojn po unu vorto.<br/><br/>Sur ĉiu ekrano aperos <b>du vortoj</b>. Unu ĝuste daŭrigas la frazon, la alia ne.<br/><br/><b>Tuŝu</b> la vorton, kiu daŭrigas la frazon.<br/><br/>Se vi elektos malĝuste, aperos ruĝa <b style='color:red'>x</b> kaj vi povos provi denove.",
      // the standard Maze speed-accuracy instruction (Forster et al. 2009: as fast
      // as possible, but not so fast that mistakes happen)
      "Elektu <b>kiel eble plej rapide</b>, sed ne tiel rapide, ke vi eraras.<br/><br/>" +
        "Ne longe cerbumu pri unuopa vorto. Kutime la ĝusta vorto tuj videblas. " +
        "Fidu vian unuan impreson kaj legu je via <b>natura legrapido</b>, kvazaŭ vi legus ordinaran tekston.<br/><br/>" +
        "Ni mezuras, kiom da tempo vi bezonas por ĉiu vorto, do gravas respondi flue kaj sen halti.",
      "Post kelkaj frazoj aperos <b>demando</b> pri la enhavo. Tuŝu la ĝustan respondon.<br/><br/>Ĉi tiu parto daŭras ĉirkaŭ <b>12&ndash;15 minutojn</b>.",
      "<b>Antaŭ ol komenci</b><br/><br/>" +
        "Bonvolu ŝalti sur via telefono la reĝimon <b>&bdquo;Ne ĝeni&ldquo;</b> " +
        "(en Android: <i>Ne ĝeni</i> / <i>Do Not Disturb</i>; en iPhone: " +
        "<i>Fokuso &rarr; Ne ĝeni</i>), por ke sciigoj kaj vokoj ne interrompu vin.<br/><br/>" +
        "Elektu ankaŭ kvietan lokon, kie oni ne parolos al vi dum la sekvaj minutoj.",
      "La ĉefa parto konsistas el <b>" + n_blocks + " blokoj</b> po ĉirkaŭ <b>" +
        BREAK_EVERY + " frazoj</b>. Inter la blokoj estas <b>planita paŭzo</b>, " +
        "kaj ĝi daŭras tiom longe, kiom vi volas, do vi rajtas tie trinki, " +
        "movi vin aŭ rigardi vian telefonon.<br/><br/>" +
        "Sed <b>ene de bloko</b> ni petas vin legi <b>senĉese kaj plene koncentrite</b>: " +
        "ne paŭzu meze de bloko kaj ne lasu vin distri. Ni mezuras la tempon de ĉiu " +
        "unuopa vorto, do eĉ mallonga interrompo malutilas al la rezultoj.<br/><br/>" +
        "Ni komencos per <b>tri ekzercaj frazoj</b>."
    ],
    show_clickable_nav: true,
    allow_backward: true,
    allow_keys: false,
    button_label_next: "Sekva",
    button_label_previous: "Antaŭa"
  });

  var main_started = false;
  sentence_order.forEach(function(sent, s_idx) {
    if (sent.type !== "practice" && !main_started) {
      main_started = true;
      timeline.push({
        type: jsPsychInstructions,
        data: { trial1: "instructions" },
        pages: ["Fino de la ekzercado.<br/><br/>Nun komenciĝas la <b>ĉefa parto</b>.<br/><br/>" +
                "Memoru, elektu <b>rapide sed zorge</b>, sen longa pripensado."],
        show_clickable_nav: true, allow_backward: false, allow_keys: false,
        button_label_next: "Komenci"
      });
    }
    sent.words.forEach(function(w, w_idx) {
      word_tally += 1;
      var mt = maze_word_trial(sent, w, w_idx, word_tally);
      timeline.push({
        timeline: [{ timeline: [mt, { timeline: [error_trial], conditional_function: last_correct }],
                     loop_function: last_correct }]
      });
    });
    if (sent.q) timeline.push(question_trial(sent));
    timeline.push(between_sentences);
    // break every 24 main sentences
    var main_idx = s_idx - maze_practice.length + 1;
    if (sent.type !== "practice" && main_idx > 0 && main_idx % BREAK_EVERY === 0 && main_idx < n_main) {
      timeline.push({
        type: jsPsychInstructions,
        data: { trial1: "instructions" },
        // the break screen doubles as a checkpoint: the upload runs behind it
        on_start: upload_checkpoint,
        pages: ["Vi finis " + main_idx + " el " + n_main + " frazoj.<br/><br/>" +
                "Vi rajtas ripozi tiom longe, kiom vi volas.<br/><br/>" +
                "Tuŝu <b>Daŭrigi</b> nur kiam vi pretas denove legi plene koncentrite."],
        show_clickable_nav: true, allow_backward: false, allow_keys: false,
        button_label_next: "Daŭrigi"
      });
    }
  });

  if (SES_POSITION === "after") {
    timeline = timeline.concat(build_ses_timeline(jsPsych, "after"));
  }

  jsPsych.run(timeline);
}

assign_list(start);

</script>
</body>
</html>
